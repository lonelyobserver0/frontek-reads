<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#264653"/>
      <stop offset="65%" stop-color="#1c3640"/>
      <stop offset="150%" stop-color="#2A9D8F"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#E9C46A" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#E9C46A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- RSS mark -->
  <g transform="translate(96,120)">
    <rect width="96" height="96" rx="21" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="30" cy="66" r="7" fill="#E76F51"/>
    <path d="M23 48 a25 25 0 0 1 25 25" fill="none" stroke="#E9C46A" stroke-width="8" stroke-linecap="round"/>
    <path d="M23 32 a41 41 0 0 1 41 41" fill="none" stroke="#2A9D8F" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="230" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="#E9C46A">FRONTEK READS</text>
  <text x="96" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff">Your feeds,</text>
  <text x="96" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff">in one place.</text>

  <text x="96" y="546" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#9fb7bd">A private RSS reader — no account, no server, all in your browser.</text>
</svg>
